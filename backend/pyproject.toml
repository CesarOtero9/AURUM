[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum"
version = "0.1.0"
description = "AURUM fiscal and accounting intelligence platform"
requires-python = ">=3.12,<3.13"

dependencies = [
    "alembic>=1.14,<2.0",
    "defusedxml>=0.7,<1.0",
    "fastapi>=0.116,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
